jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
      - name: Sintaxis PHP
        run: |
          php -l app/controllers/SeguimientoVinculacionController.php
          php -l app/models/SeguimientoVinculacionModel.php
          php -l app/services/TelefoniaEntrantesAnalistaService.php
          php -l app/views/seguimiento_vinculacion/llamadas_entrantes.php
          php -l app/views/seguimiento_vinculacion/index.php
          php -l app/views/seguimiento_vinculacion/estado.php
          php -l app/views/telefonia/shell.php
          php -l app/views/layout/topbar.php
          php -l app/views/layout/dashboard_head.php
          php -l app/views/layout/dashboard_footer.php
      - name: JS y límites funcionales
        run: |
          node --check public/javascript/telefonia_shell.js
          node --check public/javascript/telefonia_persistente.js
          node --check public/javascript/seguimiento_entrantes_analista.js
          php tests/telefonia_analista_entrantes_smoke.php
          php tests/telefonia_shell_smoke.php
          php tests/seguimiento_modales_responsive_smoke.php
          bash -n tools/desplegar_entrantes_analista_hostinger.sh
          bash -n tests/telefonia_analista_hostinger_smoke.sh
          bash tests/telefonia_analista_hostinger_smoke.sh
          bash -n tools/desplegar_ui_entrantes_analista_hostinger.sh
          bash -n tests/telefonia_analista_ui_smoke.sh
          bash tests/telefonia_analista_ui_smoke.sh
          bash -n tools/desplegar_controles_webRTC_analista_hostinger.sh
          bash -n tests/telefonia_analista_webRTC_controles_smoke.sh
          bash tests/telefonia_analista_webRTC_controles_smoke.sh
          bash -n tools/restaurar_recepcion_webRTC_hostinger.sh
          bash -n tests/telefonia_recuperacion_recepcion_smoke.sh
          bash tests/telefonia_recuperacion_recepcion_smoke.sh
          php -l app/views/telefonia/host.php
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_sdk_entrantes_observador.js
          node tests/telefonia_sdk_entrantes_observador_smoke.js
          bash -n tools/desplegar_timbrado_webRTC_analista_hostinger.sh
          bash -n tests/telefonia_sdk_entrantes_hostinger_smoke.sh
          bash tests/telefonia_sdk_entrantes_hostinger_smoke.sh
          bash -n tools/desplegar_flujo_entrante_webRTC_analista_hostinger.sh
          bash -n tests/telefonia_flujo_entrante_webRTC_analista_smoke.sh
          bash tests/telefonia_flujo_entrante_webRTC_analista_smoke.sh
          php -l app/services/TelefoniaAnalistaWebrtcService.php
          node --check public/javascript/seguimiento_entrantes_analista.js
          bash -n tools/desplegar_historial_entrantes_webRTC_analista_hostinger.sh
          bash tests/telefonia_webrtc_historial_analista_smoke.sh
          php -l tools/resolver_conflicto_shell_analista.php
          bash -n tools/desplegar_historial_webrtc_reconciliado_hostinger.sh
          bash tests/telefonia_historial_webrtc_reconciliado_smoke.sh
          bash -n tools/recuperar_recepcion_analista_ultimo_historial_hostinger.sh
          bash tests/telefonia_analista_recuperar_ultima_publicacion_smoke.sh
          php -l tools/injectar_historial_pasivo_analista.php
          node --check public/javascript/telefonia_analista_historial_pasivo.js
          node tests/telefonia_analista_historial_pasivo_smoke.js
          bash -n tools/desplegar_historial_pasivo_analista_hostinger.sh
          bash tests/telefonia_analista_historial_pasivo_deploy_smoke.sh
          bash -n tools/desplegar_modal_unificado_analista_hostinger.sh
          bash tests/telefonia_modal_unificado_analista_hostinger_smoke.sh
          bash -n tools/desplegar_botones_modal_final_analista_hostinger.sh
          bash tests/telefonia_botones_modal_final_analista_hostinger_smoke.sh
