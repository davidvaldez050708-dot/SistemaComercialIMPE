name: Asesores - reportes desempeño y PDF
on: [pull_request]
permissions:
  contents: read
jobs:
  datos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0','mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd, zip
          coverage: none
      - run: |
          composer install --no-interaction --prefer-dist --no-scripts --no-progress
          composer reinstall '*' --no-interaction --prefer-dist --no-scripts --no-progress
      - name: Métricas, permisos, consultas y PDF por HTTP y SQL
        env:
          IMPE_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          php tests/ventas_actividad_unit.php
          python3 tests/ventas_actividad_http_test.py
  interfaz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/asesores-deps playwright@1.56.1 bootstrap@5.3.8 bootstrap-icons@1.11.3
      - run: /tmp/asesores-deps/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - env:
          NODE_PATH: /tmp/asesores-deps/node_modules
          SALES_BROWSER: ${{ matrix.browser }}
        run: node tests/ventas_actividad_browser.cjs
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip
          coverage: none
      - run: |
          composer install --no-interaction --prefer-dist --no-scripts --no-progress
          composer reinstall '*' --no-interaction --prefer-dist --no-scripts --no-progress
          pip install pypdf
          python3 tests/ventas_actividad_pdf_test.py
  publicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: python3 tests/publicacion_reportes_asesores_test.py
