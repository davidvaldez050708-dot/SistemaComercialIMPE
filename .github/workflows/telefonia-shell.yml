name: Telefonia WebRTC persistente
on:
  push:
    branches: [main]
    paths:
      - "app/controllers/LoginController.php"
      - "app/controllers/TelefoniaController.php"
      - "app/views/telefonia/shell.php"
      - "app/views/telefonia/host.php"
      - "app/views/telefonia/recepcion_marketing.php"
      - "public/javascript/telefonia_shell.js"
      - "tools/desplegar_cierre_transferencia_hostinger.sh"
      - "tools/fusionar_cierre_transferencia_hostinger.py"
      - "tools/fusionar_cierre_transferencia_legacy_hostinger.py"
      - "tests/telefonia_cierre_transferencia_legacy_hostinger_smoke.sh"
      - "tests/telefonia_cierre_transferencia_hostinger_smoke.sh"
      - "public/javascript/telefonia_shell_navegacion.js"
      - "tools/desplegar_estabilidad_shell_analista_hostinger.sh"
      - "tests/telefonia_shell_navegacion_smoke.js"
      - "tests/telefonia_shell_estabilidad_hostinger_smoke.sh"
      - "tests/telefonia_shell_diario_hostinger_compat_smoke.sh"
      - "tests/telefonia_shell_css_personalizado_smoke.sh"
      - "tools/desplegar_navegacion_nativa_crm_hostinger.sh"
      - "tests/telefonia_shell_navegacion_nativa_hostinger_smoke.sh"
      - "app/views/layout/dashboard_head.php"
      - "public/javascript/telefonia_persistente.js"
      - "public/javascript/telefonia_host.js"
      - "app/controllers/TelefoniaController.php"
      - "app/services/TelefoniaTransferenciaContextoService.php"
      - "public/javascript/telefonia_enrutamiento.js"
      - "public/javascript/telefonia_analista_historial_pasivo.js"
      - "public/javascript/seguimiento_entrantes_analista.js"
      - "tools/desplegar_contexto_transferencia_hostinger.sh"
      - "tools/desplegar_contexto_duracion_formulario_hostinger.sh"
      - "tests/telefonia_contexto_duracion_formulario_hostinger_smoke.sh"
      - "app/services/TelefoniaAnalistaWebrtcService.php"
      - "app/views/seguimiento_vinculacion/llamadas_entrantes.php"
      - "public/css/seguimiento_entrantes_analista.css"
      - "tests/telefonia_transferencia_contexto_hostinger_smoke.sh"
      - "public/javascript/telefonia_sdk_entrantes_observador.js"
      - "tools/desplegar_respuesta_transferida_hostinger.sh"
      - "tools/fusionar_respuesta_transferida_hostinger.py"
      - "tests/telefonia_respuesta_transferida_hostinger_smoke.sh"
      - "public/javascript/telefonia_analista_historial_pasivo.js"
      - "public/javascript/seguimiento_entrantes_analista.js"
      - "tools/desplegar_resultado_transferida_analista_hostinger.sh"
      - "tools/desplegar_resultado_unico_analista_hostinger.sh"
      - "tools/desplegar_sin_toast_analista_hostinger.py"
      - "tests/telefonia_sin_toast_analista_hostinger_smoke.sh"
      - "tests/telefonia_resultado_unico_analista_hostinger_smoke.sh"
      - "tests/telefonia_analista_resultado_transferido_smoke.js"
      - "tests/telefonia_analista_resultado_transferido_hostinger_smoke.sh"
      - "public/javascript/telefonia_webrtc_dtmf.js"
      - "public/javascript/telefonia_enrutamiento.js"
      - "tools/desplegar_transferencia_dtmf_hostinger.sh"
      - "tests/telefonia_webrtc_dtmf_smoke.js"
      - "tests/telefonia_transferencia_dtmf_hostinger_smoke.sh"
      - "public/javascript/telefonia_enrutamiento.js"
      - "tools/desplegar_transferencia_operativa_hostinger.sh"
      - "tools/fusionar_telefonia_transferencia_operativa_hostinger.py"
      - "tests/telefonia_transferencia_operativa_hostinger_smoke.sh"
      - "public/javascript/telefonia_entrantes_bridge.js"
      - "public/css/telefonia_shell.css"
      - "public/css/telefonia_host.css"
      - "public/css/telefonia_recepcion_marketing.css"
      - "tools/desplegar_telefonia_shell_hostinger.sh"
      - "tools/desplegar_telefonia_entrantes_hostinger.sh"
      - "tools/desplegar_modal_entrantes_hostinger.sh"
      - "tools/desplegar_salientes_modal_hostinger.sh"
      - "tools/desplegar_estado_salientes_hostinger.sh"
      - "tools/desplegar_cierre_y_audios_marketing_hostinger.sh"
      - "tests/marketing_audio_cierre_despliegue_smoke.sh"
      - "prueba_telefonia/api/zadarma_estado_llamada.php"
      - "tests/telefonia_estado_salientes_permisos_smoke.php"
      - "tests/telefonia_estado_salientes_despliegue_smoke.sh"
      - "tools/fusionar_salientes_persistente.php"
      - "public/css/telefonia_teclado.css"
      - "public/javascript/telefonia_teclado.js"
      - "tests/telefonia_salientes_modal_despliegue_smoke.sh"
      - "tools/diagnosticar_shell_telefonia_hostinger.sh"
      - "tools/reparar_assets_telefonia_hostinger.sh"
      - "tools/normalizar_telefonia_host_css.php"
      - "tools/resolver_conflictos_telefonia.php"
      - "tools/revertir_telefonia_shell_hostinger.sh"
      - "tests/telefonia_shell_smoke.php"
      - "tests/telefonia_entrantes_interfaz_smoke.php"
      - "tests/telefonia_entrantes_despliegue_smoke.sh"
      - "tests/telefonia_resolver_conflictos_smoke.sh"
      - "tests/telefonia_shell_render_smoke.php"
      - "tests/telefonia_shell_runtime_smoke.js"
      - "tests/telefonia_entrantes_bridge_smoke.js"
      - "tests/telefonia_modal_entrantes_despliegue_smoke.sh"
      - "tests/telefonia_diagnostico_shell_smoke.sh"
      - "tests/telefonia_assets_permisos_smoke.sh"
      - "tests/telefonia_shell_despliegue_smoke.sh"
      - "tests/telefonia_shell_upgrade_smoke.sh"
      - ".github/workflows/telefonia-shell.yml"
  pull_request:
jobs:
  analista-sin-toast-persistido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Sin toast antiguo al login ni sustitución del shell WebRTC
        run: |
          python3 -m py_compile tools/desplegar_sin_toast_analista_hostinger.py
          bash tests/telefonia_sin_toast_analista_hostinger_smoke.sh
  contexto-duracion-formulario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Probar identidad, duración y formulario, sin afectar teléfono
        run: |
          bash tests/telefonia_contexto_duracion_formulario_hostinger_smoke.sh
  unico-resultado-analista-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Comprobar modal único, sin toast duplicado y rollback
        run: |
          python3 --version
          bash tests/telefonia_resultado_unico_analista_hostinger_smoke.sh
  contexto-institucion-transferida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Identificación de Recepción y expediente propio con rollback
        run: |
          bash tests/telefonia_transferencia_contexto_hostinger_smoke.sh
  responder-transferencia-sip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Espera de respuesta SIP y Hostinger reversible (Python 3.8)
        run: |
          python3 --version
          python3 -m py_compile tools/fusionar_respuesta_transferida_hostinger.py
          node tests/telefonia_sdk_entrantes_observador_smoke.js
          node tests/telefonia_entrantes_bridge_smoke.js
          bash tests/telefonia_respuesta_transferida_hostinger_smoke.sh
  resultado-analista-transferida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Duración y registro del Analista sin tocar WebRTC
        run: |
          node --check public/javascript/telefonia_analista_historial_pasivo.js
          node --check public/javascript/seguimiento_entrantes_analista.js
          node tests/telefonia_analista_resultado_transferido_smoke.js
          bash tests/telefonia_analista_resultado_transferido_hostinger_smoke.sh
  transferencia-dtmf-automatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Probar puente RFC2833 y despliegue sin widget
        run: |
          node --check public/javascript/telefonia_webrtc_dtmf.js
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_enrutamiento.js
          node tests/telefonia_webrtc_dtmf_smoke.js
          bash tests/telefonia_transferencia_dtmf_hostinger_smoke.sh
  transferencia-operativa-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recepción multirrol, transferencia PBX y publicación reversible
        run: |
          bash tests/telefonia_transferencia_operativa_hostinger_smoke.sh
  cierre-legacy-hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar sintaxis y fusión del shell histórico
        run: |
          python3 -m py_compile tools/fusionar_cierre_transferencia_legacy_hostinger.py
          bash -n tools/desplegar_cierre_transferencia_hostinger.sh
          bash tests/telefonia_cierre_transferencia_legacy_hostinger_smoke.sh
  telefonia-persistente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validar sintaxis de vistas y controladores
        run: |
          php -l app/controllers/LoginController.php
          php -l app/controllers/TelefoniaController.php
          php -l app/views/telefonia/shell.php
          php -l app/views/telefonia/host.php
          php -l app/views/telefonia/recepcion_marketing.php
          php -l prueba_telefonia/api/zadarma_estado_llamada.php
          php tests/telefonia_estado_salientes_permisos_smoke.php
      - name: Comprobar controles y ciclo de vida del shell
        run: |
          php tests/telefonia_shell_smoke.php
          php tests/telefonia_entrantes_interfaz_smoke.php
          php tests/telefonia_shell_render_smoke.php
          node --check public/javascript/telefonia_shell.js
          node --check public/javascript/telefonia_shell_navegacion.js
          node tests/telefonia_shell_navegacion_smoke.js
          node --check public/javascript/telefonia_persistente.js
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_entrantes_bridge.js
          node tests/telefonia_shell_runtime_smoke.js
          node tests/telefonia_entrantes_bridge_smoke.js
      - name: Despliegue simulado Hostinger
        run: |
          python3 -m py_compile tools/fusionar_cierre_transferencia_hostinger.py
          python3 -m py_compile tools/fusionar_cierre_transferencia_legacy_hostinger.py
          bash tests/telefonia_cierre_transferencia_legacy_hostinger_smoke.sh
          bash -n tools/desplegar_cierre_transferencia_hostinger.sh
          bash tests/telefonia_cierre_transferencia_hostinger_smoke.sh
          bash -n tools/desplegar_telefonia_shell_hostinger.sh
          bash -n tools/revertir_telefonia_shell_hostinger.sh
          bash -n tests/telefonia_shell_despliegue_smoke.sh
          bash tests/telefonia_shell_despliegue_smoke.sh
          bash -n tests/telefonia_shell_upgrade_smoke.sh
          bash tests/telefonia_shell_upgrade_smoke.sh
          bash -n tools/desplegar_estabilidad_shell_analista_hostinger.sh
          bash tests/telefonia_shell_estabilidad_hostinger_smoke.sh
          bash -n tests/telefonia_shell_diario_hostinger_compat_smoke.sh
          bash tests/telefonia_shell_diario_hostinger_compat_smoke.sh
          bash tests/telefonia_shell_css_personalizado_smoke.sh
          bash tests/telefonia_shell_navegacion_nativa_hostinger_smoke.sh
          bash -n tools/desplegar_telefonia_entrantes_hostinger.sh
          bash -n tests/telefonia_entrantes_despliegue_smoke.sh
          bash tests/telefonia_entrantes_despliegue_smoke.sh
          php -l tools/resolver_conflictos_telefonia.php
          bash -n tests/telefonia_resolver_conflictos_smoke.sh
          bash tests/telefonia_resolver_conflictos_smoke.sh
          bash -n tools/desplegar_modal_entrantes_hostinger.sh
          bash -n tools/diagnosticar_shell_telefonia_hostinger.sh
          bash tests/telefonia_diagnostico_shell_smoke.sh
          bash -n tests/telefonia_modal_entrantes_despliegue_smoke.sh
          bash tests/telefonia_modal_entrantes_despliegue_smoke.sh
          bash -n tools/reparar_assets_telefonia_hostinger.sh
          bash tests/telefonia_assets_permisos_smoke.sh
          php -l tools/fusionar_salientes_persistente.php
          bash -n tools/desplegar_salientes_modal_hostinger.sh
          bash tests/telefonia_salientes_modal_despliegue_smoke.sh
          bash -n tools/desplegar_estado_salientes_hostinger.sh
          bash tests/telefonia_estado_salientes_despliegue_smoke.sh
          bash -n tools/desplegar_cierre_y_audios_marketing_hostinger.sh
          bash tests/marketing_audio_cierre_despliegue_smoke.sh
