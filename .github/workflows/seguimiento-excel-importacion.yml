name: Seguimiento · importación Excel de instituciones
on:
  pull_request:
    paths:
      - 'app/controllers/SeguimientoVinculacionController.php'
      - 'app/services/SeguimientoExcel*.php'
      - 'app/services/SeguimientoHistorialImportadoService.php'
      - 'app/views/seguimiento_vinculacion/index.php'
      - 'public/javascript/seguimiento_importacion_excel.js'
      - 'public/css/seguimiento_importacion_excel.css'
      - 'tests/seguimiento_importador_excel_smoke.php'
      - 'tests/seguimiento_importador_excel_browser.cjs'
      - 'tests/fixtures/seguimiento_excel_importador.php'
      - 'tests/publicacion_seguimiento_excel_territorio_test.py'
      - 'tests/*seguimiento_excel*'
      - 'tests/fixtures/seguimiento_plantilla_v3_anterior.xlsx'
      - 'tools/*seguimiento_excel_multiestado*'
      - 'tools/publicar_seguimiento_excel_territorio.py'
      - 'tools/seguimiento_excel_territorio_release.json'
      - '.github/workflows/seguimiento-excel-importacion.yml'
  push:
    branches:
      - 'feat/seguimiento-importador-instituciones-xlsx-v1-20261026'
      - 'fix/seguimiento-importador-territorio'
permissions:
  contents: read
jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    env:
      IMPE_TEST_MYSQL_PORT: 33329
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports: ['33329:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, zip, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis PHP y JavaScript
        run: |
          php -l app/controllers/SeguimientoVinculacionController.php
          php -l app/services/SeguimientoExcelImportService.php
          php -l app/services/SeguimientoExcelPlantillaService.php
          php -l app/services/SeguimientoHistorialImportadoService.php
          php -l app/views/seguimiento_vinculacion/index.php
          php -l tests/seguimiento_importador_excel_smoke.php
          node --check public/javascript/seguimiento_importacion_excel.js
      - name: Generar plantilla y probar pasos declarados
        run: php tests/seguimiento_importador_excel_smoke.php
      - name: Verificar alcance y persistencia multiestado en BD aislada
        run: |
          php tests/seguimiento_excel_alcance_test.php
          php tests/seguimiento_excel_multiestado_db.php
          python3 tests/seguimiento_excel_plantilla_http_test.py
      - name: Verificar publicación selectiva y restauración
        run: python3 tests/publicacion_seguimiento_excel_multiestado_test.py
  formulario:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, zip, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/seguimiento-excel-deps playwright@1.56.1 bootstrap@5.3.8 bootstrap-icons@1.11.3
      - run: /tmp/seguimiento-excel-deps/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - env:
          NODE_PATH: /tmp/seguimiento-excel-deps/node_modules
          SALES_BROWSER: ${{ matrix.browser }}
          SALES_SCREENSHOT_DIR: tmp/excel-multiestado
        run: node tests/seguimiento_importador_excel_browser.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seguimiento-excel-${{ matrix.browser }}
          path: tmp/excel-multiestado/
