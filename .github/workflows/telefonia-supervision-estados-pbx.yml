name: Supervisión telefónica · estados PBX
on:
  push:
    branches:
      - fix/supervision-estados-pbx-conciliar-hostinger-20261027
  pull_request:
    paths:
      - app/services/TelefoniaControlService.php
      - tests/telefonia_control_supervision_estado_pbx_smoke.php
      - tests/telefonia_supervision_vista_hostinger_smoke.php
      - tools/conciliar_telefonia_supervision_vista_v1.php
      - .github/workflows/telefonia-supervision-estados-pbx.yml
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validación de sintaxis
        run: |
          php -l app/services/TelefoniaControlService.php
          php -l tests/telefonia_control_supervision_estado_pbx_smoke.php
          php -l tests/telefonia_supervision_vista_hostinger_smoke.php
          php -l tools/conciliar_telefonia_supervision_vista_v1.php
      - name: Regresión de motivos de terminación y privacidad por tramo
        run: |
          php tests/telefonia_control_supervision_estado_pbx_smoke.php
          php tests/telefonia_supervision_vista_hostinger_smoke.php
