name: Seguimiento - Historial de llamadas

on:
  push:
    branches: [main]
    paths:
      - "prueba_telefonia/api/llamadas_seguimiento.php"
      - "public/javascript/seguimiento_llamadas_expediente.js"
      - "tools/desplegar_historial_llamadas_expediente_hostinger.sh"
      - "tests/seguimiento_historial_llamadas_hostinger_smoke.sh"
      - "tools/desplegar_diagnostico_historial_llamadas_hostinger.sh"
      - "tests/seguimiento_historial_diagnostico_hostinger_smoke.sh"
      - "app/services/ZadarmaWebhookEventStoreService.php"
      - "public/javascript/seguimiento_llamadas_desplegable.js"
      - "tools/desplegar_conexion_historial_llamadas_hostinger.sh"
      - "tests/seguimiento_conexion_historial_hostinger_smoke.sh"
      - "config/db_connection.php"
      - "tools/desplegar_mysql_persistente_historial_hostinger.sh"
      - "tests/seguimiento_mysql_persistente_hostinger_smoke.sh"
      - "tools/desplegar_grabaciones_sin_parpadeo_hostinger.sh"
      - "tests/seguimiento_grabaciones_sin_parpadeo_smoke.sh"
      - "tools/desplegar_mysql_persistente_global_hostinger.sh"
      - "tests/mysql_persistente_global_hostinger_smoke.sh"
      - "tools/desplegar_leyenda_webrtc_y_audio_hostinger.sh"
      - "tests/seguimiento_audio_webrtc_sin_vinculo_smoke.sh"
      - "app/helpers/TelefoniaFechaHoraHelper.php"
      - "app/services/TelefoniaAnalistaWebrtcService.php"
      - "app/controllers/SeguimientoVinculacionController.php"
      - "tools/diagnosticar_grabacion_webrtc_analista.php"
      - "tools/desplegar_hora_mexico_webrtc_hostinger.sh"
      - "tests/seguimiento_fecha_webrtc_hostinger_smoke.sh"
      - "tools/diagnosticar_pbx_grabacion_extensiones.php"
      - ".github/workflows/seguimiento-historial-llamadas.yml"
  pull_request:
    paths:
      - "prueba_telefonia/api/llamadas_seguimiento.php"
      - "public/javascript/seguimiento_llamadas_expediente.js"
      - "tools/desplegar_historial_llamadas_expediente_hostinger.sh"
      - "tests/seguimiento_historial_llamadas_hostinger_smoke.sh"
      - "tools/desplegar_diagnostico_historial_llamadas_hostinger.sh"
      - "tests/seguimiento_historial_diagnostico_hostinger_smoke.sh"
      - "app/services/ZadarmaWebhookEventStoreService.php"
      - "public/javascript/seguimiento_llamadas_desplegable.js"
      - "tools/desplegar_conexion_historial_llamadas_hostinger.sh"
      - "tests/seguimiento_conexion_historial_hostinger_smoke.sh"
      - "config/db_connection.php"
      - "tools/desplegar_mysql_persistente_historial_hostinger.sh"
      - "tests/seguimiento_mysql_persistente_hostinger_smoke.sh"
      - "tools/desplegar_grabaciones_sin_parpadeo_hostinger.sh"
      - "tests/seguimiento_grabaciones_sin_parpadeo_smoke.sh"
      - "tools/desplegar_mysql_persistente_global_hostinger.sh"
      - "tests/mysql_persistente_global_hostinger_smoke.sh"
      - "tools/desplegar_leyenda_webrtc_y_audio_hostinger.sh"
      - "tests/seguimiento_audio_webrtc_sin_vinculo_smoke.sh"
      - "app/helpers/TelefoniaFechaHoraHelper.php"
      - "app/services/TelefoniaAnalistaWebrtcService.php"
      - "app/controllers/SeguimientoVinculacionController.php"
      - "tools/diagnosticar_grabacion_webrtc_analista.php"
      - "tools/desplegar_hora_mexico_webrtc_hostinger.sh"
      - "tests/seguimiento_fecha_webrtc_hostinger_smoke.sh"
      - "tools/diagnosticar_pbx_grabacion_extensiones.php"
      - ".github/workflows/seguimiento-historial-llamadas.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validar sintaxis y lectura del historial
        run: |
          php -l prueba_telefonia/api/llamadas_seguimiento.php
          node --check public/javascript/seguimiento_llamadas_expediente.js
          bash -n tools/desplegar_historial_llamadas_expediente_hostinger.sh
          bash -n tests/seguimiento_historial_llamadas_hostinger_smoke.sh
          bash -n tools/desplegar_diagnostico_historial_llamadas_hostinger.sh
          bash -n tests/seguimiento_historial_diagnostico_hostinger_smoke.sh
          php -l app/services/ZadarmaWebhookEventStoreService.php
          node --check public/javascript/seguimiento_llamadas_desplegable.js
          bash -n tools/desplegar_conexion_historial_llamadas_hostinger.sh
          bash -n tests/seguimiento_conexion_historial_hostinger_smoke.sh
          php -l config/db_connection.php
          bash -n tools/desplegar_mysql_persistente_historial_hostinger.sh
          bash -n tests/seguimiento_mysql_persistente_hostinger_smoke.sh
          bash -n tools/desplegar_grabaciones_sin_parpadeo_hostinger.sh
          bash -n tests/seguimiento_grabaciones_sin_parpadeo_smoke.sh
          bash -n tools/desplegar_mysql_persistente_global_hostinger.sh
          bash -n tests/mysql_persistente_global_hostinger_smoke.sh
          bash -n tools/desplegar_leyenda_webrtc_y_audio_hostinger.sh
          bash -n tests/seguimiento_audio_webrtc_sin_vinculo_smoke.sh
          php -l app/helpers/TelefoniaFechaHoraHelper.php
          php -l app/services/TelefoniaAnalistaWebrtcService.php
          php -l app/controllers/SeguimientoVinculacionController.php
          php -l tools/diagnosticar_grabacion_webrtc_analista.php
          php -l tools/diagnosticar_pbx_grabacion_extensiones.php
          bash -n tools/desplegar_hora_mexico_webrtc_hostinger.sh
          bash -n tests/seguimiento_fecha_webrtc_hostinger_smoke.sh
      - name: Simular parche selectivo de Hostinger
        run: bash tests/seguimiento_historial_llamadas_hostinger_smoke.sh
      - name: Simular bitácora privada de errores PHP en Hostinger
        run: bash tests/seguimiento_historial_diagnostico_hostinger_smoke.sh
      - name: Simular historial con una conexión y consulta compartida
        run: bash tests/seguimiento_conexion_historial_hostinger_smoke.sh
      - name: Simular conexión persistente solo para historial
        run: bash tests/seguimiento_mysql_persistente_hostinger_smoke.sh
      - name: No renderizar sección duplicada de grabaciones
        run: bash tests/seguimiento_grabaciones_sin_parpadeo_smoke.sh
      - name: Validar persistencia MySQL global en simulación Hostinger
        run: bash tests/mysql_persistente_global_hostinger_smoke.sh
      - name: Comprobar que WebRTC no muestre marcador y audio falso
        run: bash tests/seguimiento_audio_webrtc_sin_vinculo_smoke.sh
      - name: Convertir hora UTC WebRTC a México y validar despliegue
        run: bash tests/seguimiento_fecha_webrtc_hostinger_smoke.sh
