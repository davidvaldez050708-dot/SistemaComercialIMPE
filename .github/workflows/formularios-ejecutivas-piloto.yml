name: Inscripción Ejecutivas · piloto seguro
on:
  push:
    paths:
      - 'app/services/FormularioEjecutivasPerfiles.php'
      - 'app/services/FormularioEjecutivasValidacion.php'
      - 'app/controllers/FormularioController.php'
      - 'app/views/formularios/inscripcion_ejecutivas_previa.php'
      - 'app/views/formularios/inscripcion_programas.php'
      - 'public/css/formularios_ejecutivas_piloto.css'
      - 'public/javascript/formularios_ejecutivas_piloto.js'
      - 'tests/formularios_ejecutivas_piloto_smoke.php'
      - '.github/workflows/formularios-ejecutivas-piloto.yml'
  pull_request:
    paths:
      - 'app/services/FormularioEjecutivasPerfiles.php'
      - 'app/services/FormularioEjecutivasValidacion.php'
      - 'app/controllers/FormularioController.php'
      - 'app/views/formularios/inscripcion_ejecutivas_previa.php'
      - 'app/views/formularios/inscripcion_programas.php'
      - 'public/css/formularios_ejecutivas_piloto.css'
      - 'public/javascript/formularios_ejecutivas_piloto.js'
      - 'tests/formularios_ejecutivas_piloto_smoke.php'
      - '.github/workflows/formularios-ejecutivas-piloto.yml'

permissions:
  contents: read

jobs:
  vista-piloto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
      - name: Sintaxis PHP y JavaScript
        run: |
          php -l app/services/FormularioEjecutivasPerfiles.php
          php -l app/services/FormularioEjecutivasValidacion.php
          php -l app/controllers/FormularioController.php
          php -l app/views/formularios/inscripcion_ejecutivas_previa.php
          php -l app/views/formularios/inscripcion_programas.php
          php -l tests/formularios_ejecutivas_piloto_smoke.php
          node --check public/javascript/formularios_ejecutivas_piloto.js
      - name: Diez perfiles y validación CURP sin datos reales
        run: php tests/formularios_ejecutivas_piloto_smoke.php
