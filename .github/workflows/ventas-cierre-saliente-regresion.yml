name: Ventas - cierre saliente y modal de resultado
on:
  push:
    branches:
      - fix/ventas-etapa2-audio-operacion
    paths:
      - 'app/services/TelefoniaVentasLlamadasService.php'
      - 'public/javascript/telefonia_shell.js'
      - 'public/javascript/telefonia_ventas_shell.js'
      - 'tests/telefonia_ventas_descartar_modal_resultado.cjs'
      - 'tests/publicacion_ventas_saliente_modal_test.py'
      - 'tools/publicar_ventas_saliente_modal_resultado_hostinger.sh'
      - '.github/workflows/ventas-cierre-saliente-regresion.yml'
  pull_request:
    paths:
      - 'app/services/TelefoniaVentasLlamadasService.php'
      - 'public/javascript/telefonia_shell.js'
      - 'public/javascript/telefonia_ventas_shell.js'
      - 'tests/telefonia_ventas_descartar_modal_resultado.cjs'
      - 'tests/publicacion_ventas_saliente_modal_test.py'
      - 'tools/publicar_ventas_saliente_modal_resultado_hostinger.sh'
      - '.github/workflows/ventas-cierre-saliente-regresion.yml'
jobs:
  dirigido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar sintaxis
        run: |
          php -l app/services/TelefoniaVentasLlamadasService.php
          node --check public/javascript/telefonia_shell.js
          node --check public/javascript/telefonia_ventas_shell.js
          bash -n tools/publicar_ventas_saliente_modal_resultado_hostinger.sh
      - name: Probar descarte de modal y sesiones distintas
        run: node tests/telefonia_ventas_descartar_modal_resultado.cjs
      - name: Probar desplegador reversible
        run: python3 tests/publicacion_ventas_saliente_modal_test.py
