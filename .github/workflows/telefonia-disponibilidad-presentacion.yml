name: Disponibilidad - presentacion y estados sin regresiones
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/css/telefonia_disponibilidad.css'
      - 'public/javascript/telefonia_disponibilidad.js'
      - 'tests/telefonia_disponibilidad_browser.cjs'
      - 'tools/publicar_disponibilidad_ui_hostinger.sh'
      - 'tests/telefonia_disponibilidad_ui_hostinger_smoke.py'
      - '.github/workflows/telefonia-disponibilidad-presentacion.yml'
permissions:
  contents: read
jobs:
  ui-y-despliegue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y publicador de dos archivos
        run: |
          node --check public/javascript/telefonia_disponibilidad.js
          php -l app/views/telefonia/disponibilidad.php
          python3 tests/telefonia_disponibilidad_ui_hostinger_smoke.py
      - name: Navegador real - recepción y analista
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 bootstrap@5.3.3
          npx playwright install --with-deps chromium
          node tests/telefonia_disponibilidad_browser.cjs
