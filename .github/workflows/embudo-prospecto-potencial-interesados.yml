name: Embudo - Prospecto potencial a Interesados
on:
  push:
    branches:
      - fix/embudo-prospecto-potencial-interesados-20261110
permissions:
  contents: read
jobs:
  verificar-mapeo-y-despliegue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
      - name: Validar PHP y reglas de movimiento
        run: |
          php -l app/services/EmbudoComercialEtapas.php
          php tests/embudo_comercial_fase2_unit.php
      - name: Validar publicador sobre copia
        run: |
          python3 -m py_compile tools/publicar_prospecto_potencial_interesados_hostinger.py
          python3 tests/publicar_prospecto_potencial_interesados_hostinger_test.py
