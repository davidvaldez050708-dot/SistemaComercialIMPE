name: Telefonia - notificaciones leida vs atendida
on:
  pull_request:
    paths:
      - 'app/services/TelefoniaNotificacionService.php'
      - 'app/services/TelefoniaNotificacionVentasService.php'
      - 'app/controllers/ConvocatoriaNotificacionController.php'
      - 'app/views/layout/topbar.php'
      - 'public/javascript/telefonia_notificaciones.js'
      - 'public/javascript/recordatorios.js'
      - 'prueba_telefonia/api/leer_todas_notificaciones_llamada.php'
      - 'tests/telefonia_ventas_notificaciones_db.php'
      - 'tests/telefonia_notificaciones_unificacion_smoke.php'
      - 'tests/telefonia_notificaciones_leida_atendida_browser.cjs'
      - 'tests/publicacion_notificaciones_leidas_pendientes_test.py'
      - 'tools/publicar_notificaciones_leidas_pendientes_hostinger.sh'
      - '.github/workflows/telefonia-notificaciones-leida-atendida.yml'
jobs:
  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar pruebas Chromium
        run: |
          npm install --prefix /tmp/notificaciones-e2e playwright bootstrap@5.3.8
          /tmp/notificaciones-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Sintaxis y contrato sin BD
        run: |
          php -l app/services/TelefoniaNotificacionService.php
          php -l app/services/TelefoniaNotificacionVentasService.php
          php -l app/controllers/ConvocatoriaNotificacionController.php
          php -l app/views/layout/topbar.php
          php -l prueba_telefonia/api/leer_todas_notificaciones_llamada.php
          php tests/telefonia_notificaciones_unificacion_smoke.php
          node --check public/javascript/telefonia_notificaciones.js
          node --check public/javascript/recordatorios.js
          node --check tests/telefonia_notificaciones_leida_atendida_browser.cjs
      - name: Browser - Marketing y campana general
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/notificaciones-e2e/node_modules/playwright
          BOOTSTRAP_MODULE_PATH: /tmp/notificaciones-e2e/node_modules/bootstrap
        run: |
          node tests/telefonia_notificaciones_leida_atendida_browser.cjs
          node tests/telefonia_campana_browser.cjs
      - name: Publicador reversible y variante Hostinger
        run: python3 tests/publicacion_notificaciones_leidas_pendientes_test.py
  base_datos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0','mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
      - name: Regresión de avisos por estado y propietario
        env:
          IMPE_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          IMPE_TEST_MYSQL_USER: root
        run: |
          php tests/telefonia_ventas_notificaciones_db.php
          php tests/telefonia_notificaciones_orden.php
