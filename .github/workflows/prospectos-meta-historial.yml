name: Prospectos - historial de importaciones Meta
on:
  push:
    branches:
      - feat/prospectos-meta-historial-importaciones-20261107
  pull_request:
    paths:
      - 'app/services/ProspectoMetaImportacionesHistorial.php'
      - 'app/services/ProspectoMetaImportador.php'
      - 'app/controllers/ProspectoController.php'
      - 'app/views/prospectos/central.php'
      - 'app/views/prospectos/partials/historial_importaciones_meta.php'
      - 'public/css/prospectos_importador_meta.css'
      - 'database/migrations/2026_11_07_prospectos_meta_historial_importaciones.sql'
      - 'tests/prospectos_meta_historial_*'
      - '.github/workflows/prospectos-meta-historial.yml'
permissions:
  contents: read
jobs:
  php-vistas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,mysqli,zip,xml
      - name: Validación PHP
        run: |
          php -l app/services/ProspectoMetaImportacionesHistorial.php
          php -l app/services/ProspectoMetaImportador.php
          php -l app/controllers/ProspectoController.php
          php -l app/views/prospectos/central.php
          php -l app/views/prospectos/partials/historial_importaciones_meta.php
          php tests/prospectos_meta_historial_ui_test.php
          php tests/prospectos_campanias_formularios_unificado_ui_test.php
          php tests/prospectos_meta_archivo_unit.php
          php tests/prospectos_meta_clasificacion_unit.php
      - name: Comprobación CSS institucional
        run: |
          python3 tests/prospectos_campanias_formularios_unificado_css_test.py
  mysql-historial:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,mysqli
      - name: 36 archivos ficticios, sumas, reintentos y páginas
        env:
          IMPE_HIST_META_DB_TEST: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: php tests/prospectos_meta_historial_db.php
  publicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paquete y rollback en sitio ficticio
        run: |
          python3 -m py_compile tools/publicar_prospectos_meta_historial.py
          python3 tests/prospectos_meta_historial_release_test.py
