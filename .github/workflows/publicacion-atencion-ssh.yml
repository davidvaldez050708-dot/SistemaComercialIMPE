name: Publicador SSH de atención del analista
on:
  push:
    branches: [main]
    paths: ['tools/publicar_atencion_analista_hostinger.sh', 'tests/publicacion_atencion_hostinger_test.py', '.github/workflows/publicacion-atencion-ssh.yml']
  pull_request:
    paths: ['tools/publicar_atencion_analista_hostinger.sh', 'tests/publicacion_atencion_hostinger_test.py', '.github/workflows/publicacion-atencion-ssh.yml']
permissions:
  contents: read
jobs:
  sitios-temporales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar, publicar, preservar y restaurar sin acceso a producción
        env:
          IMPE_TEST_NETWORK: '1'
        run: python3 tests/publicacion_atencion_hostinger_test.py
