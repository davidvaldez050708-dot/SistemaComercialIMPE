name: Instalación personalizada audio expediente
on:
  push:
    branches: [main]
    paths:
      - 'tools/desplegar_audio_pbx_expediente_personalizado_hostinger.py'
      - 'tests/audio_pbx_expediente_personalizado_deploy_smoke.py'
      - '.github/workflows/audio-expediente-hostinger-personalizado.yml'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Despliegue simulado, sintaxis y guardas
        run: |
          python3 -m py_compile tools/desplegar_audio_pbx_expediente_personalizado_hostinger.py
          python3 tests/audio_pbx_expediente_personalizado_deploy_smoke.py
          php -l app/services/TelefoniaGrabacionExpedienteTransferidaService.php
          php -l prueba_telefonia/api/llamadas_seguimiento.php
          node --check public/javascript/seguimiento_llamadas_expediente.js
