name: Aliados programas origen y toast
on:
  pull_request:
    paths:
      - 'public/javascript/aliados_registro.js'
      - 'tests/aliados_programas_origen_toast.cjs'
      - 'tests/publicacion_aliados_programas_origen_test.py'
      - 'tools/*aliados_programas_origen*'
      - '.github/workflows/aliados-programas-origen.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      NODE_PATH: /tmp/aliados-origen/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --prefix /tmp/aliados-origen playwright@1.56.1
      - name: Reproducir error instalado y comprobar formulario corregido
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/aliados_programas_origen_toast.cjs
      - name: Instalación selectiva y restauración
        run: python tests/publicacion_aliados_programas_origen_test.py
