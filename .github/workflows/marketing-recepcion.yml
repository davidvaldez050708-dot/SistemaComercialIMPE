name: Marketing - Recepción WebRTC y presentación
on:
  push:
    branches: [main]
    paths:
      - "app/views/dashboard/marketing.php"
      - "app/views/telefonia/recepcion_marketing.php"
      - "app/views/telefonia/host.php"
      - "public/css/telefonia_recepcion_marketing.css"
      - "public/css/telefonia_host.css"
      - "public/javascript/telefonia_persistente.js"
      - "public/javascript/telefonia_host.js"
      - "tools/desplegar_marketing_recepcion_hostinger.sh"
      - "tools/desplegar_ajustes_recepcion_marketing_hostinger.sh"
      - "tools/desplegar_historial_unificado_marketing_hostinger.sh"
      - "tests/marketing_historial_unificado_despliegue_smoke.sh"
      - "tools/fusionar_css_recepcion_marketing.php"
      - "public/javascript/telefonia_recepcion_marketing.js"
      - "app/services/ZadarmaRecordingService.php"
      - "prueba_telefonia/api/grabacion_recepcion_marketing.php"
      - "app/services/TelefoniaGrabacionSalienteMarketingService.php"
      - "tests/marketing_grabaciones_salientes_smoke.php"
      - "tests/marketing_audio_cierre_despliegue_smoke.sh"
      - "tools/desplegar_cierre_y_audios_marketing_hostinger.sh"
      - "tests/marketing_recepcion_pestana_smoke.php"
      - "tests/marketing_recepcion_deploy_smoke.sh"
      - "tests/marketing_recepcion_ajustes_despliegue_smoke.sh"
      - "tests/marketing_recepcion_historial_smoke.js"
      - "tests/marketing_historial_pbx_unificado_smoke.php"
      - "app/services/TelefoniaRecepcionMarketingService.php"
      - "prueba_telefonia/api/resultado_recepcion_marketing.php"
      - "prueba_telefonia/api/grabacion_transferida_pbx.php"
      - "tests/marketing_recepcion_operativa_smoke.php"
      - ".github/workflows/marketing-recepcion.yml"
  pull_request:
jobs:
  validar-operacion-recepcion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Estados, transferencias y resultados de recepción
        run: |
          php -l prueba_telefonia/api/resultado_recepcion_marketing.php
          php -l prueba_telefonia/api/grabacion_transferida_pbx.php
          php -l app/views/telefonia/recepcion_marketing.php
          node --check public/javascript/telefonia_recepcion_marketing.js
          php tests/marketing_recepcion_operativa_smoke.php
          php tests/marketing_historial_pbx_unificado_smoke.php
          php tests/marketing_grabaciones_salientes_smoke.php
          node tests/marketing_recepcion_historial_smoke.js
  validar-recepcion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Verificar interfaz Marketing y modo pestaña
        run: |
          php -l app/views/dashboard/marketing.php
          php -l app/views/telefonia/recepcion_marketing.php
          php -l app/views/telefonia/host.php
          php tests/marketing_recepcion_pestana_smoke.php
          php -l app/services/TelefoniaRecepcionMarketingService.php
          php tests/marketing_historial_pbx_unificado_smoke.php
          node --check public/javascript/telefonia_persistente.js
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_recepcion_marketing.js
          node tests/marketing_recepcion_historial_smoke.js
          php -l app/services/ZadarmaRecordingService.php
          php -l prueba_telefonia/api/grabacion_recepcion_marketing.php
          php -l app/services/TelefoniaGrabacionSalienteMarketingService.php
          php tests/marketing_grabaciones_salientes_smoke.php
      - name: Simular publicación repetida Hostinger
        run: |
          bash -n tools/desplegar_marketing_recepcion_hostinger.sh
          bash -n tests/marketing_recepcion_deploy_smoke.sh
          bash tests/marketing_recepcion_deploy_smoke.sh
          php -l tools/fusionar_css_recepcion_marketing.php
          bash -n tools/desplegar_ajustes_recepcion_marketing_hostinger.sh
          bash tests/marketing_recepcion_ajustes_despliegue_smoke.sh
          bash -n tools/desplegar_historial_unificado_marketing_hostinger.sh
          bash tests/marketing_historial_unificado_despliegue_smoke.sh
          bash -n tools/desplegar_cierre_y_audios_marketing_hostinger.sh
          bash tests/marketing_audio_cierre_despliegue_smoke.sh
