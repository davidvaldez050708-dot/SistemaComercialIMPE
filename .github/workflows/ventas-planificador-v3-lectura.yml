name: Ventas - planificador V3 PBX sin escrituras
on:
  push:
    branches:
      - feat/ventas-planificador-pbx-multiseleccion-segura-20261111
  pull_request:
    paths:
      - 'app/services/EmbudoComercialPlanificadorV3.php'
      - 'app/services/EmbudoComercialIntentosPbxRepository.php'
      - 'tests/embudo_comercial_planificador_v3_unit.php'
      - 'tests/embudo_intentos_pbx_db.php'
      - 'docs/ventas_planificador_v3_shadow_20261111.md'
      - 'tools/ventas_v3_preflight_solo_lectura.php'
      - '.github/workflows/ventas-planificador-v3-lectura.yml'
permissions:
  contents: read
jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,mysqli
      - name: Sintaxis, V4 y regresiones comerciales
        run: |
          php -l app/services/EmbudoComercialPlanificadorV3.php
          php -l app/services/EmbudoComercialIntentosPbxRepository.php
          php -l tests/embudo_comercial_planificador_v3_unit.php
          php -l tests/embudo_intentos_pbx_db.php
          php -l tools/ventas_v3_preflight_solo_lectura.php
          php tests/embudo_comercial_planificador_v3_unit.php
          php tests/embudo_comercial_politica_propuesta_unit.php
          php tests/embudo_comercial_fase1_unit.php
          php tests/embudo_comercial_fase2_unit.php
  mysql-temporal:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,mysqli
      - name: Plan 1/3 2/3 3/3 y multiselección, sólo base desechable
        env:
          IMPE_EMBUDO_PBX_TEST_DB: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: php tests/embudo_intentos_pbx_db.php
