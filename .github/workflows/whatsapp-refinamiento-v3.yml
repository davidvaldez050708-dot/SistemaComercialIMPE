name: WhatsApp refinamiento V3
on:
  push:
    branches: [fix/whatsapp-recepcion-segura-20261127]
    paths:
      - 'tools/whatsapp_refinamiento_v3/**'
      - '.github/workflows/whatsapp-refinamiento-v3.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic_test_only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 33319:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      IMPE_WHATSAPP_VENTAS_TEST: 'YES'
      MYSQL_USER: root
      MYSQL_PASSWORD: synthetic_test_only
      MYSQL_PORT: '33319'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
      - run: php tools/whatsapp_refinamiento_v3/test_presentacion.php
      - run: python3 tools/whatsapp_refinamiento_v3/prepare_sql.py
      - run: php tests/whatsapp_ventas_db.php
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/whatsapp_refinamiento_v3/prepare_browser.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/whatsapp_refinamiento_v3/browser.cjs
