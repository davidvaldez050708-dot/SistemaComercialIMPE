name: Ventas V3 - operativo institucional para asesores
on:
  push:
    branches:
      - feat/ventas-v3-asesores-operativo-institucional-20261111
  pull_request:
    paths:
      - 'app/controllers/EmbudoComercialController.php'
      - 'app/services/EmbudoComercialRepository.php'
      - 'app/services/EmbudoComercialV3CalificacionService.php'
      - 'app/services/EmbudoComercialV3MovimientosPermitidos.php'
      - 'app/views/embudo_comercial/operativo_v3.php'
      - 'app/views/embudo_comercial/index.php'
      - 'app/views/embudo_comercial/detalle.php'
      - 'public/css/embudo_v3_operativo.css'
      - 'public/javascript/embudo_comercial_v3_operativo.js'
      - 'tests/embudo_comercial_v3_previsualizacion_db.php'
      - 'tests/ventas_v3_asesor_operativo_render_unit.php'
      - 'tests/ventas_v3_toast_browser.cjs'
      - 'app/services/EmbudoComercialV3RecuperacionAuditoria.php'
      - 'tools/ventas_v3_recuperacion_auditoria_hostinger.php'
      - 'tests/ventas_v3_recuperacion_auditoria_unit.php'
      - 'app/services/EmbudoComercialResultadoBridge.php'
      - 'tests/ventas_v3_recuperacion_bridge_proteccion_unit.php'
      - 'app/services/EmbudoComercialV3BandejasService.php'
      - 'app/views/embudo_comercial/bandejas_v3.php'
      - 'app/views/embudo_comercial/bandejas_v3_modal.php'
      - 'public/css/embudo_v3_bandejas.css'
      - 'public/javascript/embudo_comercial_v3_bandejas.js'
      - 'tests/ventas_v3_bandejas_db.php'
      - 'tests/ventas_v3_bandejas_browser.cjs'
      - 'tests/gestion_comercial_v3_bandejas_render_unit.php'
      - 'tests/gestion_comercial_no_contactar_db.php'
      - 'database/migrations/2026_11_12_ventas_inscripcion_v3_evidencia.sql'
      - 'app/services/EmbudoComercialV3InscripcionService.php'
      - 'app/views/embudo_comercial/inscripcion_v3_modal.php'
      - 'public/javascript/embudo_comercial_v3_inscripcion.js'
      - 'public/javascript/telefonia_marcador.js'
      - 'prueba_telefonia/api/zadarma_estado_llamada.php'
      - 'tools/publicar_gestion_comercial_v3_integral_hostinger.py'
      - 'tools/gestion_comercial_v3_inscripcion_schema_hostinger.php'
      - 'tools/gestion_comercial_v3_auditar_distribucion_hostinger.php'
      - 'tests/gestion_comercial_v3_integral_publicador_unit.py'
      - 'tests/gestion_comercial_hostinger_telefonia_conciliada_unit.php'
      - 'tools/gestion_comercial_v3_validar_conciliacion_privada_hostinger.py'
      - 'tools/preparar_gestion_comercial_v3_conciliada_hostinger.py'
      - 'tests/gestion_comercial_v3_dialer_guard_browser.cjs'
      - 'tests/gestion_comercial_v3_inscripcion_db.php'
      - 'tests/gestion_comercial_v3_inscripcion_browser.cjs'
      - 'app/services/ProspectoNoContactarV3.php'
      - 'app/services/TelefoniaMarcacionesVentasService.php'
      - 'app/services/WhatsAppCloudApiService.php'
      - 'app/models/WhatsAppModel.php'
      - 'app/controllers/WhatsAppController.php'
      - 'app/controllers/TelefoniaController.php'
      - 'tools/publicar_ventas_v3_bandejas_hostinger.py'
      - 'tests/ventas_v3_bandejas_publicador_unit.py'
      - 'tools/publicar_ventas_v3_proteccion_recuperacion_hostinger.py'
      - 'tests/ventas_v3_recuperacion_guardia_publicador_unit.py'
      - 'tools/publicar_ventas_v3_asesores_hostinger.py'
      - 'tests/ventas_v3_publicador_asesores_unit.py'
      - 'docs/ventas_v3_asesores_operativo_20261111.md'
      - '.github/workflows/ventas-v3-asesores-operativo-seguro.yml'
permissions:
  contents: read
jobs:
  lint-regresion-y-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
      - name: Sintaxis, instituciones, llamadas y regresión
        run: |
          php -l app/controllers/EmbudoComercialController.php
          php -l app/services/EmbudoComercialRepository.php
          php -l app/services/EmbudoComercialV3CalificacionService.php
          php -l app/services/EmbudoComercialV3MovimientosPermitidos.php
          php -l app/views/embudo_comercial/operativo_v3.php
          php -l app/views/embudo_comercial/index.php
          php -l app/views/embudo_comercial/detalle.php
          php -l tests/ventas_v3_asesor_operativo_render_unit.php
          php -l tests/embudo_comercial_v3_previsualizacion_db.php
          node --check public/javascript/embudo_comercial_v3_operativo.js
          php tests/ventas_v3_asesor_operativo_render_unit.php
          python3 -m py_compile tools/publicar_ventas_v3_asesores_hostinger.py
          python3 -m py_compile tests/ventas_v3_publicador_asesores_unit.py
          python3 tests/ventas_v3_publicador_asesores_unit.py
          php tests/ventas_v3_tarjetas_render_solo_lectura_unit.php
          php tests/embudo_comercial_fase1_unit.php
          php tests/embudo_comercial_fase2_unit.php
          php tests/embudo_comercial_politica_propuesta_unit.php
          php tests/embudo_comercial_planificador_v3_unit.php
          php -l app/services/EmbudoComercialV3RecuperacionAuditoria.php
          php -l tools/ventas_v3_recuperacion_auditoria_hostinger.php
          php -l tests/ventas_v3_recuperacion_auditoria_unit.php
          php tests/ventas_v3_recuperacion_auditoria_unit.php
          php -l app/services/EmbudoComercialResultadoBridge.php
          php -l tests/ventas_v3_recuperacion_bridge_proteccion_unit.php
          php tests/ventas_v3_recuperacion_bridge_proteccion_unit.php
          php -l app/services/EmbudoComercialV3BandejasService.php
          php -l app/views/embudo_comercial/bandejas_v3.php
          php -l app/views/embudo_comercial/bandejas_v3_modal.php
          php -l tests/ventas_v3_bandejas_db.php
          php -l tests/gestion_comercial_v3_bandejas_render_unit.php
          php tests/gestion_comercial_v3_bandejas_render_unit.php
          php -l app/services/ProspectoNoContactarV3.php
          php -l app/services/TelefoniaMarcacionesVentasService.php
          php -l app/services/WhatsAppCloudApiService.php
          php -l app/models/WhatsAppModel.php
          php -l app/controllers/WhatsAppController.php
          php -l app/controllers/TelefoniaController.php
          php -l prueba_telefonia/api/zadarma_estado_llamada.php
          php tests/gestion_comercial_hostinger_telefonia_conciliada_unit.php
          php -l tools/gestion_comercial_v3_inscripcion_schema_hostinger.php
          php -l tools/gestion_comercial_v3_auditar_distribucion_hostinger.php
          python3 -m py_compile tools/publicar_gestion_comercial_v3_integral_hostinger.py
          python3 -m py_compile tools/preparar_gestion_comercial_v3_conciliada_hostinger.py
          python3 tests/gestion_comercial_v3_integral_publicador_unit.py
          php -l tests/gestion_comercial_no_contactar_db.php
          php -l app/services/EmbudoComercialV3InscripcionService.php
          php -l app/views/embudo_comercial/inscripcion_v3_modal.php
          php -l tests/gestion_comercial_v3_inscripcion_db.php
          node --check public/javascript/embudo_comercial_v3_inscripcion.js
          node --check tests/gestion_comercial_v3_inscripcion_browser.cjs
          node --check public/javascript/telefonia_marcador.js
          node --check tests/gestion_comercial_v3_dialer_guard_browser.cjs
          node --check public/javascript/embudo_comercial_v3_bandejas.js
          node --check tests/ventas_v3_bandejas_browser.cjs
          python3 -m py_compile tools/publicar_ventas_v3_bandejas_hostinger.py
          python3 -m py_compile tests/ventas_v3_bandejas_publicador_unit.py
          python3 tests/ventas_v3_bandejas_publicador_unit.py
          python3 -m py_compile tools/publicar_ventas_v3_proteccion_recuperacion_hostinger.py tests/ventas_v3_recuperacion_guardia_publicador_unit.py
          python3 tests/ventas_v3_recuperacion_guardia_publicador_unit.py
      - name: Avisos y calificación en Chromium
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/impe-ventas-v3/node_modules/playwright
          BOOTSTRAP_MODULE_PATH: /tmp/impe-ventas-v3/node_modules/bootstrap
        run: |
          npm install --prefix /tmp/impe-ventas-v3 playwright@1.56.1 bootstrap@5.3.8
          /tmp/impe-ventas-v3/node_modules/.bin/playwright install --with-deps chromium
          node tests/ventas_v3_toast_browser.cjs
          node tests/ventas_v3_bandejas_browser.cjs
          node tests/gestion_comercial_v3_inscripcion_browser.cjs
          node tests/gestion_comercial_v3_dialer_guard_browser.cjs
  mysql-temporal:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
      - name: Propiedad, 23 tarjetas, PBX, legados, whitelist
        env:
          IMPE_V3_PREVIA_DB_TEST: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: |
          php tests/embudo_comercial_v3_previsualizacion_db.php
          IMPE_EMBUDO_PBX_TEST_DB=YES php tests/embudo_intentos_pbx_db.php
          IMPE_V3_BANDEJAS_TEST_DB=YES php tests/ventas_v3_bandejas_db.php
          IMPE_NO_CONTACTAR_TEST_DB=YES php tests/gestion_comercial_no_contactar_db.php
          IMPE_V3_INSCRIPCION_TEST_DB=YES php tests/gestion_comercial_v3_inscripcion_db.php
  mariadb-temporal:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli,mbstring
      - name: Propiedad, 23 tarjetas, PBX, legados y paginación
        env:
          IMPE_V3_PREVIA_DB_TEST: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: |
          php tests/embudo_comercial_v3_previsualizacion_db.php
          IMPE_EMBUDO_PBX_TEST_DB=YES php tests/embudo_intentos_pbx_db.php
          IMPE_V3_BANDEJAS_TEST_DB=YES php tests/ventas_v3_bandejas_db.php
          IMPE_NO_CONTACTAR_TEST_DB=YES php tests/gestion_comercial_no_contactar_db.php
          IMPE_V3_INSCRIPCION_TEST_DB=YES php tests/gestion_comercial_v3_inscripcion_db.php
