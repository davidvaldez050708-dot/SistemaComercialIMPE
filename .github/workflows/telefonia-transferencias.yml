name: Telefonía - Transferencias seguras
on:
  push:
    branches: [main]
    paths:
      - "app/services/TelefoniaEnrutamientoService.php"
      - "app/services/TelefoniaEntrantesAnalistaService.php"
      - "app/controllers/TelefoniaController.php"
      - "app/controllers/TerritorioController.php"
      - "app/models/TerritorioModel.php"
      - "app/views/telefonia/host.php"
      - "app/views/telefonia/shell.php"
      - "app/views/layout/dashboard_head.php"
      - "app/views/territorios/equipo.php"
      - "app/views/seguimiento_vinculacion/llamadas_entrantes.php"
      - "public/css/telefonia_enrutamiento.css"
      - "public/javascript/telefonia_enrutamiento.js"
      - "public/javascript/telefonia_host.js"
      - "public/javascript/telefonia_shell.js"
      - "public/javascript/telefonia_persistente.js"
      - "public/javascript/seguimiento_entrantes_analista.js"
      - "tests/telefonia_transferencias_seguras_smoke.php"
      - "tests/telefonia_transferencias_hostinger_smoke.sh"
      - "tools/desplegar_transferencias_seguras_hostinger.sh"
      - "tools/fusionar_shell_transferencias_hostinger.py"
      - "tools/desplegar_recepcion_rapida_hostinger.sh"
      - "tests/telefonia_recepcion_rapida_smoke.php"
      - "tests/telefonia_recepcion_rapida_hostinger_smoke.sh"
      - "tests/telefonia_recepcion_rapida_runtime_smoke.js"
      - ".github/workflows/telefonia-transferencias.yml"
  pull_request:
    paths:
      - "app/**"
      - "public/javascript/telefonia_*"
      - "public/css/telefonia_enrutamiento.css"
      - "tests/telefonia_transferencias_*"
      - "tools/desplegar_transferencias_*"
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli
      - name: PHP sin errores
        run: |
          php -l app/services/TelefoniaEnrutamientoService.php
          php -l app/services/TelefoniaEntrantesAnalistaService.php
          php -l app/controllers/TelefoniaController.php
          php -l app/controllers/TerritorioController.php
          php -l app/models/TerritorioModel.php
          php -l app/views/telefonia/host.php
          php -l app/views/telefonia/shell.php
          php -l app/views/layout/dashboard_head.php
          php -l app/views/territorios/equipo.php
          php -l app/views/seguimiento_vinculacion/llamadas_entrantes.php
      - name: JavaScript y autorizaciones
        run: |
          node --check public/javascript/telefonia_enrutamiento.js
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_shell.js
          node --check public/javascript/telefonia_persistente.js
          node --check public/javascript/seguimiento_entrantes_analista.js
          php tests/telefonia_transferencias_seguras_smoke.php
          php tests/telefonia_recepcion_rapida_smoke.php
          node tests/telefonia_recepcion_rapida_runtime_smoke.js
          node tests/telefonia_shell_runtime_smoke.js
          node tests/telefonia_shell_navegacion_smoke.js
          php tests/telefonia_entrantes_visual_smoke.php
      - name: Despliegue Hostinger en entorno temporal
        run: |
          bash -n tools/desplegar_transferencias_seguras_hostinger.sh
          python3 -c "import ast, pathlib; p=pathlib.Path('tools/fusionar_shell_transferencias_hostinger.py'); s=p.read_text(); assert 'from __future__ import annotations' not in s; ast.parse(s, feature_version=(3, 6))"
          bash tests/telefonia_transferencias_hostinger_smoke.sh
          bash -n tools/desplegar_recepcion_rapida_hostinger.sh
          bash tests/telefonia_recepcion_rapida_hostinger_smoke.sh
