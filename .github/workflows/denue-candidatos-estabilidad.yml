name: DENUE - certificados y candidatos estables
on:
  pull_request:
    paths:
      - 'app/services/Denue*'
      - 'app/controllers/SeguimientoVinculacionController.php'
      - 'app/views/seguimiento_vinculacion/estado.php'
      - 'public/javascript/seguimiento_candidatos_paginacion.js'
      - 'config/certificates/**'
      - 'tests/denue*'
      - 'tests/fixtures/denue_paginado_vista.php'
      - 'tests/publicacion_denue_estabilidad.py'
      - 'tools/*denue*'
      - '.github/workflows/denue-candidatos-estabilidad.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, openssl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y política TLS
        run: |
          php -l app/services/DenueService.php
          php -l app/services/DenueCandidatosHttpClient.php
          php -l app/services/DenueTlsPolicy.php
          php -l app/services/DenueCandidatosConsultaService.php
          php -l app/controllers/SeguimientoVinculacionController.php
          php -l tools/diagnosticar_denue_tls.php
      - name: Transporte real con servidor local y datos ficticios
        run: python tests/denue_http_local.py
      - name: Caché, candidatos y permisos de filtros
        run: |
          php tests/denue_candidatos_resiliencia.php
          php tests/denue_consulta_paginada.php
          node tests/denue_paginacion_cliente.js
      - name: Paginación y configuración privada
        run: |
          php tests/seguimiento_candidatos_paginacion_smoke.php
          node tests/seguimiento_candidatos_paginacion_smoke.js
          php tests/private_config_smoke.php
      - name: Publicación selectiva, variantes Hostinger y reversión
        run: |
          python tools/construir_denue_release.py --check
          python tests/publicacion_denue_estabilidad.py
      - name: Modal real, continuación y más de 300 resultados
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p tmp/denue-bootstrap
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o tmp/denue-bootstrap/bootstrap.min.css
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o tmp/denue-bootstrap/bootstrap.bundle.min.js
          node tests/denue_paginacion_browser.cjs
  python36-hostinger:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, openssl
      - name: Probar instalador con Python 3.6.8 oficial y PHP real
        shell: pwsh
        run: |
          $denueZip = Join-Path $env:RUNNER_TEMP 'denue-python368.zip'
          $denueRuntime = Join-Path $env:RUNNER_TEMP 'denue-python368'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.6.8/python-3.6.8-embed-amd64.zip' -OutFile $denueZip
          if ((Get-FileHash -Algorithm SHA256 $denueZip).Hash.ToLower() -ne 'efadf25a090c8438b3cbe27574fb36bd40c80e20a03939188a1d5051685495dd') { throw 'Python oficial no coincide con la huella probada' }
          Expand-Archive -LiteralPath $denueZip -DestinationPath $denueRuntime
          $denuePython = Join-Path $denueRuntime 'python.exe'
          & $denuePython --version
          # Reproducir los bytes del manifiesto descargado por HTTPS, independientemente de autocrlf.
          & $denuePython -c "import pathlib,subprocess; pathlib.Path('tools/denue_estabilidad_release.json').write_bytes(subprocess.check_output(['git','show','HEAD:tools/denue_estabilidad_release.json']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $denuePython tests/publicacion_denue_estabilidad.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
