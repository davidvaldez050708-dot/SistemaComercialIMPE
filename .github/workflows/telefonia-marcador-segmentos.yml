name: Verificar marcador y reproductor PBX
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/javascript/telefonia_teclado.js'
      - 'public/javascript/telefonia_segmentos_player.js'
      - 'public/javascript/telefonia_recepcion_marketing.js'
      - 'public/javascript/seguimiento_entrantes_analista.js'
      - 'app/views/layout/dashboard_footer.php'
      - 'tests/telefonia_marcador_segmentos_smoke.js'
      - '.github/workflows/telefonia-marcador-segmentos.yml'
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Sintaxis y regresiones del marcador y audios
        run: |
          node --check public/javascript/telefonia_teclado.js
          node --check public/javascript/telefonia_segmentos_player.js
          node --check public/javascript/telefonia_recepcion_marketing.js
          node --check public/javascript/seguimiento_entrantes_analista.js
          php -l app/views/layout/dashboard_footer.php
          node tests/telefonia_marcador_segmentos_smoke.js
          node tests/marketing_recepcion_historial_smoke.js
