name: Analista - próxima acción en todas las etapas
on:
  pull_request:
    paths:
      - 'app/services/InteraccionProximaAccion.php'
      - 'app/services/InteraccionRutaService.php'
      - 'app/services/SeguimientoFlujoService.php'
      - 'app/models/SeguimientoVinculacionModel.php'
      - 'app/controllers/SeguimientoVinculacionController.php'
      - 'public/javascript/seguimiento_interacciones.js'
      - 'tests/*proxima_accion*'
      - 'tools/*proxima_accion*'
      - '.github/workflows/analista-proxima-accion.yml'
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      IMPE_TEST_MYSQL_PORT: '3307'
      IMPE_TEST_MYSQL_USER: root
      IMPE_TEST_MYSQL_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Programación, datos vigentes y publicación reversible
        run: |
          node --check public/javascript/seguimiento_interacciones.js
          php tests/analista_proxima_accion_unit.php
          php tests/analista_proxima_accion_db.php
          php tests/verificacion_datos_vigentes.php
          php tests/telefonia_atencion_db.php
          php tests/horario_contacto_unit.php
          python tests/publicacion_analista_proxima_accion.py
          python tests/publicacion_verificacion_vigente.py
      - name: Panel real con y sin verificación, etapas y resultados
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p tmp/bootstrap
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css -o tmp/bootstrap/bootstrap.min.css
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js -o tmp/bootstrap/bootstrap.bundle.min.js
          export BOOTSTRAP_DIR=tmp/bootstrap
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/analista_proxima_accion_browser.cjs
          node tests/verificacion_datos_vigentes_browser.cjs
          node tests/analista_cancelacion_inmediata_browser.cjs
