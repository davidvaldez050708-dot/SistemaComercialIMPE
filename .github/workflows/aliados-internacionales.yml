name: Aliados internacionales Handly
on:
  pull_request:
    paths:
      - 'app/controllers/AliadoController.php'
      - 'app/views/aliados/index.php'
      - 'app/views/aliados/internacionales.php'
      - 'app/models/AliadoInternacionalModel.php'
      - 'tests/aliados_internacionales*.php'
      - 'tools/aliados_internacionales/**'
      - 'tools/publicar_aliados_internacionales_hostinger.sh'
      - 'tests/publicacion_aliados_internacionales_test.py'
      - '.github/workflows/aliados-internacionales.yml'
  workflow_dispatch:
jobs:
  sintaxis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validación de PHP y permisos de acceso
        run: |
          php -l app/controllers/AliadoController.php
          php -l app/views/aliados/index.php
          php -l app/views/aliados/internacionales.php
          php -l app/models/AliadoInternacionalModel.php
          php -l tests/aliados_internacionales.php
          php -l tests/aliados_internacionales_acceso.php
