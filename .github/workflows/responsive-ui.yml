name: UI responsive - vistas y roles

on:
  pull_request:
    paths:
      - "app/views/**"
      - "public/css/**"
      - "tests/responsive_smoke.php"
      - "tests/responsive_overflow_smoke.php"
      - "tests/analista_modulos_responsive_smoke.php"
      - "tests/seguimiento_candidatos_paginacion_smoke.js"
      - "tests/seguimiento_candidatos_paginacion_smoke.php"
      - "public/javascript/seguimiento_candidatos_paginacion.js"
      - "tools/desplegar_paginacion_candidatos_hostinger.sh"
      - "tests/seguimiento_candidatos_despliegue_smoke.sh"
      - ".github/workflows/responsive-ui.yml"
  push:
    branches: [main]
    paths:
      - "app/views/**"
      - "public/css/**"
      - "tests/responsive_smoke.php"
      - "tests/responsive_overflow_smoke.php"
      - "tests/analista_modulos_responsive_smoke.php"
      - "tests/seguimiento_candidatos_paginacion_smoke.js"
      - "tests/seguimiento_candidatos_paginacion_smoke.php"
      - "public/javascript/seguimiento_candidatos_paginacion.js"
      - "tools/desplegar_paginacion_candidatos_hostinger.sh"
      - "tests/seguimiento_candidatos_despliegue_smoke.sh"
      - ".github/workflows/responsive-ui.yml"

jobs:
  validar-responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 35 # necesita blobs base para simular la fusión de Hostinger
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Sintaxis de las vistas compartidas
        run: |
          php -l app/views/layout/dashboard_head.php
          php -l app/views/layout/topbar.php
      - name: Verificar reglas responsive compartidas
        run: |
          php tests/responsive_smoke.php
          php tests/responsive_overflow_smoke.php
          php tests/analista_inicio_responsive_smoke.php
          php tests/analista_modulos_responsive_smoke.php
          php tests/agenda_expediente_responsive_smoke.php
          php tests/agenda_toolbar_layout_smoke.php
          php tests/seguimiento_modales_responsive_smoke.php
          php -l app/views/seguimiento_vinculacion/estado.php
          php -l app/views/layout/dashboard_footer.php
          php tests/seguimiento_candidatos_paginacion_smoke.php
          php tests/roles_cuenta_clave_marketing_responsive_smoke.php
          php tests/cuenta_clave_mapa_cobertura_smoke.php
      - name: Verificar script de diagnóstico en navegador
        run: |
          node --check tests/diagnosticar_overflow_navegador.js
          node --check public/javascript/seguimiento_candidatos_paginacion.js
          node tests/seguimiento_candidatos_paginacion_smoke.js
          bash -n tools/desplegar_paginacion_candidatos_hostinger.sh
          bash -n tests/seguimiento_candidatos_despliegue_smoke.sh
      - name: Simular despliegue de paginación
        run: bash tests/seguimiento_candidatos_despliegue_smoke.sh
