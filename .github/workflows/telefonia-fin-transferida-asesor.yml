name: Ventas - cierre inmediato transferencia saliente
on:
  pull_request:
    paths:
      - public/javascript/telefonia_host.js
      - public/javascript/telefonia_transferencia_runtime.js
      - tests/telefonia_ventas_fin_transferencia_inmediato.cjs
      - tests/telefonia_transferencia_receptor_terminado.cjs
      - .github/workflows/telefonia-fin-transferida-asesor.yml
permissions:
  contents: read
jobs:
  cierre-transferencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y cierre de sesión del receptor
        run: |
          node --check public/javascript/telefonia_host.js
          node --check public/javascript/telefonia_transferencia_runtime.js
          node tests/telefonia_ventas_fin_transferencia_inmediato.cjs
          node tests/telefonia_transferencia_receptor_terminado.cjs
          node tests/telefonia_ventas_fin_sip_push_tardio.cjs
          node tests/telefonia_ventas_referencia_final.cjs
          node tests/telefonia_ventas_conciliacion_tardia.cjs
          node tests/telefonia_ventas_descartar_modal_resultado.cjs
          node tests/telefonia_transferencia_confirmada_runtime.cjs
      - name: Probar paquete reversible en réplica Hostinger
        run: python3 -B tests/publicacion_ventas_transferida_fin_test.py
