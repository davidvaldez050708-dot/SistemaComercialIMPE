name: Validar Mis llamadas
on:
  push:
    branches: [feat/mis-llamadas-base-20261018, fix/mis-llamadas-unificacion-visual-operativa-20261018]
  pull_request:
    paths:
      - 'app/services/TelefoniaMisLlamadasService.php'
      - 'app/services/TelefoniaControlService.php'
      - 'app/controllers/TelefoniaController.php'
      - 'app/views/telefonia/mis_llamadas.php'
      - 'app/views/layout/sidebar.php'
      - 'tests/telefonia_mis_llamadas_propiedad_smoke.php'
      - 'tests/telefonia_mis_llamadas_vista_smoke.php'
      - 'app/views/layout/dashboard_head.php'
      - 'app/views/layout/dashboard_footer.php'
      - 'app/views/telefonia/mis_llamadas_navegacion.php'
      - 'app/views/seguimiento_vinculacion/llamadas_entrantes.php'
      - 'app/views/telefonia/devoluciones.php'
      - 'public/css/telefonia_mis_llamadas.css'
      - 'tests/telefonia_mis_llamadas_navegacion_smoke.php'
      - 'app/views/seguimiento_vinculacion/index.php'
      - 'app/views/seguimiento_vinculacion/estado.php'
      - 'public/javascript/seguimiento_entrantes_analista.js'
jobs:
  php-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          coverage: none
      - name: Validar sintaxis
        run: |
          php -l app/services/TelefoniaControlService.php
          php -l app/services/TelefoniaMisLlamadasService.php
          php -l app/controllers/TelefoniaController.php
          php -l app/views/telefonia/mis_llamadas.php
          php -l app/views/layout/sidebar.php
          php -l tests/telefonia_mis_llamadas_propiedad_smoke.php
          php -l tests/telefonia_mis_llamadas_vista_smoke.php
          php -l app/views/layout/dashboard_head.php
          php -l app/views/layout/dashboard_footer.php
          php -l app/views/telefonia/mis_llamadas_navegacion.php
          php -l app/views/seguimiento_vinculacion/llamadas_entrantes.php
          php -l app/views/telefonia/devoluciones.php
          php -l tests/telefonia_mis_llamadas_navegacion_smoke.php
          php -l app/views/seguimiento_vinculacion/index.php
          php -l app/views/seguimiento_vinculacion/estado.php
      - name: Verificar aislamiento y paginación
        run: |
          php tests/telefonia_mis_llamadas_propiedad_smoke.php
          php tests/telefonia_mis_llamadas_vista_smoke.php
          php tests/telefonia_mis_llamadas_navegacion_smoke.php
      - name: Verificar JS de resultados recibidos
        run: node --check public/javascript/seguimiento_entrantes_analista.js
