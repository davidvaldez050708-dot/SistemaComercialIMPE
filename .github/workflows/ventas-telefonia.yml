name: Ventas - telefonía por etapas
on: [pull_request]
permissions:
  contents: read
jobs:
  recepcion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/ventas-browser playwright bootstrap@5.3.8 @fontsource/manrope@5.2.8 bootstrap-icons@1.13.1
      - run: /tmp/ventas-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Sintaxis y regresiones compartidas
        run: |
          php -l app/views/telefonia/shell.php
          node --check public/javascript/telefonia_shell.js
          node --check public/javascript/telefonia_persistente.js
          node --check public/javascript/telefonia_marcador.js
          node --check public/javascript/telefonia_ventas_shell.js
          node --check public/javascript/telefonia_ventas_resultados.js
          node --check tests/telefonia_ventas_resultado_pendiente_browser.cjs
          node --check public/javascript/telefonia_ventas_devoluciones.js
          php -l tools/migrar_telefonia_ventas.php
          php -l tools/diagnosticar_cierre_ventas.php
          php -l tools/migrar_ventas_etapa2.php
          php -l app/services/TelefoniaVentasEvidenciaService.php
          php -l app/services/TelefoniaProspectoLlamadaService.php
          php -l app/views/telefonia/ventas_paginacion.php
          php tests/telefonia_ventas_audio_evidencia.php
          node tests/telefonia_shell_runtime_smoke.js
          node tests/telefonia_shell_navegacion_smoke.js
          node tests/telefonia_ventas_guard_http.cjs
          node tests/telefonia_disponibilidad_sonido_smoke.cjs
          node tests/telefonia_recuperacion_pbx_smoke.cjs
          node tests/telefonia_host_hostinger_variante.cjs
      - name: Auricular con shell y navegador reales
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/ventas-browser/node_modules/playwright
        run: node tests/telefonia_ventas_recepcion_browser.cjs
      - name: Operación comercial y modales
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/ventas-browser/node_modules/playwright
          BOOTSTRAP_MODULE_PATH: /tmp/ventas-browser/node_modules/bootstrap
          IMPE_VENTAS_SCREENSHOTS: /tmp/ventas-bandejas-capturas
        run: |
          mkdir -p /tmp/ventas-bandejas-capturas
          node tests/telefonia_ventas_operacion_browser.cjs
          node tests/telefonia_ventas_resultado_pendiente_browser.cjs
          node tests/telefonia_ventas_etapa2_browser.cjs
          node tests/ventas_bandejas_browser.cjs
          node tests/telefonia_ventas_gestion_browser.cjs
          node tests/telefonia_modal_entrante_integracion_browser.cjs
          node tests/telefonia_disponibilidad_browser.cjs
          node tests/recordatorios_toasts_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ventas-bandejas-responsive
          path: /tmp/ventas-bandejas-capturas
      - name: Publicador selectivo en replicas
        run: |
          python3 tests/publicacion_ventas_test.py a
          python3 tests/publicacion_ventas_test.py c
          python3 tests/publicacion_ventas_test.py d
          python3 tests/publicacion_ventas_test.py e
          python3 tests/publicacion_ventas_revision_20261019_test.py
          python3 tests/publicacion_ventas_bandejas_test.py
          python3 tests/publicacion_ventas_cierre_test.py
          python3 tests/publicacion_ventas_etapa2_test.py
          python3 tests/publicacion_ventas_pr108_test.py
  datos-comerciales:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306/tcp']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos comerciales y regresión institucional
        env:
          IMPE_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          php tests/telefonia_ventas_db.php
          php tests/telefonia_ventas_audio_db.php
          php tests/telefonia_ventas_gestion_db.php
          php tests/telefonia_ventas_notificaciones_db.php
          php tests/telefonia_atencion_db.php
          php tests/telefonia_resultado_analista_modal_smoke.php
          php tests/telefonia_identidad_transferencia_db.php
          php tests/telefonia_ventas_prospecto_identificacion_smoke.php
          php tests/telefonia_mis_llamadas_propiedad_smoke.php
          php tests/telefonia_mis_llamadas_navegacion_smoke.php
          php tests/telefonia_mis_llamadas_casos_concretos_smoke.php
          php tests/telefonia_mis_llamadas_vista_smoke.php
      - name: Avisos desde PBX y base aislada hasta la campana y el toast
        env:
          IMPE_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          PLAYWRIGHT_MODULE_PATH: /tmp/ventas-e2e/node_modules/playwright
        run: |
          npm install --prefix /tmp/ventas-e2e playwright
          /tmp/ventas-e2e/node_modules/.bin/playwright install --with-deps chromium
          node tests/ventas_avisos_integracion_browser.cjs
      - name: Publicador de backend en replicas
        if: matrix.database == 'mysql:8.0'
        run: python3 tests/publicacion_ventas_test.py b
