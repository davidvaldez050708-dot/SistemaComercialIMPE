name: Ventas - auditoría histórica WhatsApp sin modificaciones
on:
  pull_request:
    paths:
      - 'tools/ventas_contacto_historico_auditar.php'
      - 'tests/ventas_contacto_historico_auditoria_db.php'
      - '.github/workflows/ventas-contacto-historico-auditoria.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:11.8']
    services:
      db:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306/tcp']
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 || mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - name: Sintaxis
        run: php -l tools/ventas_contacto_historico_auditar.php
      - name: Auditoría SQL read-only en motor aislado
        env:
          IMPE_TEST_MYSQL_PORT: ${{ job.services.db.ports[3306] }}
        run: php tests/ventas_contacto_historico_auditoria_db.php
