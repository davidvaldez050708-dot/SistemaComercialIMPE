name: Educacion Territorial - sincronizacion y diseno

on:
  push:
    branches: [main]
    paths:
      - "app/controllers/DataTerritorialController.php"
      - "app/services/InegiEducacionObjetivoService.php"
      - "app/views/data_territorial/index.php"
      - "public/javascript/educacion_objetivo.js"
      - "public/css/educacion_objetivo.css"
      - "public/inegi_educacion_objetivo.php"
      - "tests/territorial_educacion_smoke.php"
      - ".github/workflows/educacion-territorial.yml"
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Comprobar sintaxis PHP
        run: |
          php -l app/controllers/DataTerritorialController.php
          php -l app/services/InegiEducacionObjetivoService.php
          php -l app/views/data_territorial/index.php
          php -l public/inegi_educacion_objetivo.php
          php -l tests/territorial_educacion_smoke.php
      - name: Comprobar sintaxis JavaScript
        run: node --check public/javascript/educacion_objetivo.js
      - name: Probar lectura local de cache y presentacion
        run: php tests/territorial_educacion_smoke.php
