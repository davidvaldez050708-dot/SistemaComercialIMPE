name: Ventas - conciliacion legacy solo lectura
on:
  push:
    branches:
      - feat/ventas-conciliacion-legacy-solo-lectura-20261111
  pull_request:
    paths:
      - 'tools/ventas_conciliar_etapas_legacy_solo_lectura_v1.php'
      - 'tests/ventas_conciliar_etapas_legacy_solo_lectura_v1_db.php'
      - 'docs/ventas_conciliacion_legacy_solo_lectura_20261111.md'
      - '.github/workflows/ventas-conciliacion-legacy-lectura.yml'
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring,mysqli
      - name: Sintaxis y reglas comerciales previas
        run: |
          php -l tools/ventas_conciliar_etapas_legacy_solo_lectura_v1.php
          php -l tests/ventas_conciliar_etapas_legacy_solo_lectura_v1_db.php
          php tests/embudo_comercial_politica_propuesta_unit.php
          php tests/embudo_comercial_planificador_v3_unit.php
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - name: Comprobación de evidencia y no modificación en MySQL temporal
        env:
          IMPE_CONCILIACION_LEGACY_TEST_DB: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: php tests/ventas_conciliar_etapas_legacy_solo_lectura_v1_db.php
  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - name: Comprobación con MariaDB temporal
        env:
          IMPE_CONCILIACION_LEGACY_TEST_DB: YES
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: php tests/ventas_conciliar_etapas_legacy_solo_lectura_v1_db.php
